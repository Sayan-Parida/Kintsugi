name: Maven CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh ./mvnw --batch-mode --no-transfer-progress verify
      - run: java -jar orchestrator/target/orchestrator-0.1.0-alpha.jar inventory
